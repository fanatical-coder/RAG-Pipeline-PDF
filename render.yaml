services:
  - type: web
    name: rag-pipeline-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LANCEDB_URI
        sync: false
      - key: LANCEDB_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false